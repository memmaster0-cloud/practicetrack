stages:
  - build
  - test
  - package

build:
  stage: build
  image: python:3.12
  script:
    - pip install -r requirements-dev.txt
    - python -m compileall app

test:
  stage: test
  image: python:3.12
  script:
    - pip install -r requirements-dev.txt
    - flake8 . --count --statistics
    - pytest --cov=app --cov-report=term-missing --cov-fail-under=70
    - behave

package:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t practicetrack .
